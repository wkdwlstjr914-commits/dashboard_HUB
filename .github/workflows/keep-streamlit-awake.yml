name: Keep Streamlit Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Streamlit app
        env:
          STREAMLIT_APP_URL: "https://dashboardapp-l72rcjuf4t5fc6nfxymjsp.streamlit.app/"
        run: |
          echo "Warm-up ping: ${STREAMLIT_APP_URL}"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --max-time 90 "${STREAMLIT_APP_URL}" > /dev/null

          echo "Waiting for Streamlit to finish waking up"
          sleep 45

          echo "Verification ping: ${STREAMLIT_APP_URL}"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --max-time 90 "${STREAMLIT_APP_URL}" > /dev/null
