name: Keep Streamlit Awake

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Streamlit app
        env:
          STREAMLIT_APP_URL: "https://dashboardapp-l72rcjuf4t5fc6nfxymjsp.streamlit.app/"
        run: |
          echo "Pinging ${STREAMLIT_APP_URL}"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 10 --max-time 60 "${STREAMLIT_APP_URL}" > /dev/null
