name: Keep Streamlit Awake

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Streamlit app
        env:
          STREAMLIT_APP_URL: ${{ vars.STREAMLIT_APP_URL }}
        run: |
          if [ -z "${STREAMLIT_APP_URL}" ]; then
            echo "STREAMLIT_APP_URL repository variable is not set. Set it to your deployed Streamlit app URL."
            exit 0
          fi

          echo "Pinging ${STREAMLIT_APP_URL}"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 10 --max-time 60 "${STREAMLIT_APP_URL}" > /dev/null
